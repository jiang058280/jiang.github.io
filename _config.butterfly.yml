# Butterfly 主题覆盖配置
# 只把需要自定义的项写在这里即可覆盖主题默认值
# 完整配置项文档: https://butterfly.js.org

# 顶部导航栏：不显示站点标题（桌面端整条顶栏隐藏，见 custom.css）
nav:
  display_title: false

# 导航菜单（左侧导航坞由此生成）
menu:
  首页: / || fas fa-home
  最新文章: / || fas fa-clock
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  公告: /announcement/ || fas fa-bullhorn
  网站信息: /site-info/ || fas fa-chart-line
  关于: /about/ || fas fa-heart

# 自定义样式与脚本注入（不改主题源码，升级主题不受影响）
# 注意：修改了 custom.css / custom.js 后要把 v= 版本号 +1，浏览器才会拉新文件
inject:
  head:
    - <link rel="stylesheet" href="/css/custom.css?v=20260830c">
  bottom:
    - <script src="/js/custom.js?v=20260830c"></script>

# 作者头像（侧边栏作者卡片）
avatar:
  img: /img/avatar.png
  effect: false

# 顶部横幅：已按要求全部禁用（disable_top_img 优先级最高）
disable_top_img: true

# 首页副标题打字机效果
subtitle:
  enable: true
  effect: true
  source: false
  sub:
    - 把想法写成文字，把时间变成文章。
    - 记录技术与生活。
    - 欢迎来到 LGQ 的一方天地。

# 站点副标题打字机效果
# 文章卡片布局: 3 = 封面左右交替
index_layout: 3

# 页脚：版权行与框架信息行全部关闭
footer:
  owner:
    enable: false
  copyright:
    enable: false

# 侧边栏：右侧不再放任何卡片，内容全部由左侧导航坞承载
aside:
  card_announcement:
    enable: false
  card_recent_post:
    enable: false
  card_categories:
    enable: false
  card_tags:
    enable: false
  card_archives:
    enable: false
  card_webinfo:
    enable: false
  card_author:
    button:
      enable: false

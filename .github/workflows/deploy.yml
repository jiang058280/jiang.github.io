name: 部署博客到 GitHub Pages

# push 到 main 或手动触发时：构建 Hexo 并发布到 GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:

# 官方 Pages 部署所需的 OIDC 权限（零密钥配置）
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一个部署，新推送自动取消进行中的旧构建
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建 Hexo 站点
        run: npx hexo generate

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

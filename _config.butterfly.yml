# Butterfly 主题覆盖配置
# 只把需要自定义的项写在这里即可覆盖主题默认值
# 完整配置项文档: https://butterfly.js.org

# 导航菜单
menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  关于: /about/ || fas fa-heart

# 站点副标题打字机效果
subtitle:
  enable: false

# 文章默认封面（无图时使用的纯色渐变，不需要外部图片）
default_top_img_height: 

# 页脚
footer:
  owner:
    enable: true
  custom_text:

# 侧边栏头像不需要外链，先关闭 avatar 图片
aside:
  card_author:
    avatar:
      img: 
